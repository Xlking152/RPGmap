name: Apply World Bootstrap V1

on:
  push:
    branches:
      - feature/world-bootstrap-v1
    paths:
      - .github/workflows/apply-world-bootstrap-v1.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/world-bootstrap-v1
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply integration patch
        run: python .github/world-bootstrap-patch.py
      - run: npm test
      - name: Check JavaScript syntax
        shell: bash
        run: find src deployment scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - run: npm run build
      - run: npm run package:local-server
      - name: Commit tested integration patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/runtime.js src/engine/runtime-state.js src/world/model.js src/rulesets/infinite-horror/actor.js src/entities/model.js src/world/manager.js src/scene/manager.js src/multiplayer/controller.js deployment/local-server/server.mjs
          git commit -m "Integrate World-first bootstrap runtime"
          git push origin HEAD:feature/world-bootstrap-v1
