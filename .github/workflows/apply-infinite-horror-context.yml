name: Apply Infinite Horror Ruleset Context Patch

on:
  push:
    branches:
      - refactor/status-definition-authority
    paths:
      - .github/workflows/apply-infinite-horror-context.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/status-definition-authority
      - name: Patch Ruleset context propagation and regression test
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const actorPath = 'src/rulesets/infinite-horror/actor.js';
          let actor = fs.readFileSync(actorPath, 'utf8');
          const replacements = [
            [
              'function healthContext(actor) {\n  const derived = deriveInfiniteHorrorActor(actor);',
              'function healthContext(actor, context = {}) {\n  const derived = deriveInfiniteHorrorActor(actor, context);',
            ],
            [
              'function healthResult(actor, operation) {\n  const beforeContext = healthContext(actor);',
              'function healthResult(actor, operation, context = {}) {\n  const beforeContext = healthContext(actor, context);',
            ],
            [
              'return { changed: true, value: deriveInfiniteHorrorActor(actor).health, before };',
              'return { changed: true, value: deriveInfiniteHorrorActor(actor, context).health, before };',
            ],
            [
              'return { changed: true, before, value: deriveInfiniteHorrorActor(actor).health };',
              'return { changed: true, before, value: deriveInfiniteHorrorActor(actor, context).health };',
            ],
            [
              '    value: deriveInfiniteHorrorActor(actor).health,',
              '    value: deriveInfiniteHorrorActor(actor, context).health,',
            ],
            [
              '    return healthResult(actor, operation);',
              '    return healthResult(actor, operation, context);',
            ],
            [
              'export function describeInfiniteHorrorActor(actor) {\n  const derived = deriveInfiniteHorrorActor(actor);',
              'export function describeInfiniteHorrorActor(actor, context = {}) {\n  const derived = deriveInfiniteHorrorActor(actor, context);',
            ],
            [
              'export function describeInfiniteHorrorActorSheet(actor) {\n  const derived = deriveInfiniteHorrorActor(actor);',
              'export function describeInfiniteHorrorActorSheet(actor, context = {}) {\n  const derived = deriveInfiniteHorrorActor(actor, context);',
            ],
          ];
          for (const [from, to] of replacements) {
            if (!actor.includes(from)) throw new Error(`Actor patch pattern not found: ${from.slice(0, 80)}`);
            actor = actor.replace(from, to);
          }
          fs.writeFileSync(actorPath, actor);

          const testPath = 'tests/entity-health.test.js';
          let test = fs.readFileSync(testPath, 'utf8');
          const oldActorImport = "import { performActorOperation } from '../src/actor/index.js';";
          const newActorImport = "import { describeActorSheet, performActorOperation } from '../src/actor/index.js';";
          if (!test.includes(oldActorImport)) throw new Error('entity-health Actor import pattern not found');
          test = test.replace(oldActorImport, newActorImport);
          const resolverImport = "import { resolveActor } from '../src/entities/resolver.js';";
          const statusImport = "import { resolveActorEffects } from '../src/status/model.js';";
          if (!test.includes(statusImport)) {
            if (!test.includes(resolverImport)) throw new Error('entity-health resolver import pattern not found');
            test = test.replace(resolverImport, `${resolverImport}\n${statusImport}`);
          }
          const marker = "test('StatusDefinition context reaches Infinite Horror sheets and Health mutations'";
          if (!test.includes(marker)) {
            test += `\n\ntest('StatusDefinition context reaches Infinite Horror sheets and Health mutations', () => {\n  const actor = createActorFromImport({\n    formName: '默认形态', identity: { name: '状态强化角色' },\n    resources: { hp: { max: 20 }, stamina: { max: 0 }, willpower: { max: 0 } },\n    attributes: [{ id: 'strength', name: '力量', base: 2 }],\n    checks: { skills: [], saves: [] }, badStatuses: [], combat: { attacks: [], defenses: [] },\n    tokenAppearance: {}, source: { type: 'manual' },\n  });\n  const definition = {\n    id: 'status-context-buff', name: '状态强化', scopes: ['actor'], maxStacks: 1,\n    changes: [\n      { target: 'health.max', mode: 'add', value: 10 },\n      { target: 'attributes.strength', mode: 'add', value: 3 },\n    ],\n  };\n  actor.effects = [{ id: 'effect-context-buff', definitionId: definition.id, stacks: 1, enabled: true }];\n  const context = { effects: resolveActorEffects(actor, [definition]) };\n\n  const sheet = describeActorSheet(actor, context);\n  const attributes = sheet.tabs.find(tab => tab.id === 'attributes').sections[0].items;\n  assert.equal(attributes.find(item => item.id === 'strength').value, 5);\n  assert.equal(resolveActor(actor).health.max, 20);\n  assert.equal(resolveActor(actor, context).health.max, 30);\n\n  const result = performActorOperation(actor, {\n    type: 'health.runtime',\n    operation: { type: 'set-current', value: 30 },\n  }, context);\n  assert.equal(result.changed, true);\n  assert.equal(result.value.max, 30);\n  assert.equal(result.value.current, 30);\n  assert.equal(resolveActor(actor, context).health.current, 30);\n});\n`;
          }
          fs.writeFileSync(testPath, test);
          NODE
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rulesets/infinite-horror/actor.js tests/entity-health.test.js
          git commit -m "Propagate StatusDefinition context through Infinite Horror"
          git push origin HEAD:refactor/status-definition-authority
