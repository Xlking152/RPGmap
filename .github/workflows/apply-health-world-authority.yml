name: Apply Health World Authority

on:
  push:
    branches:
      - refactor/health-world-operation-authority
    paths:
      - .github/workflows/apply-health-world-authority.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/health-world-operation-authority
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Patch remaining Health confirmation callsites
        run: python .github/health-authority-patch.py
      - run: npm test
      - name: Check JavaScript syntax
        run: find src deployment scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - run: npm run build
      - run: npm run package:local-server
      - name: Commit tested patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/health/sheet-extension.js src/chat/controller.js tests/token-health.test.js tests/health-world-operation-authority.test.js
          git commit -m "Await canonical Health World operations"
          git push origin HEAD:refactor/health-world-operation-authority
