name: Apply Actor Failure Rollback

on:
  push:
    branches:
      - refactor/actor-world-operation-authority
    paths:
      - .github/workflows/apply-actor-failure-rollback.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/actor-world-operation-authority
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Patch Actor failure rollback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, label):
              p = Path(path)
              source = p.read_text()
              if old not in source:
                  raise RuntimeError(f'Pattern not found ({label})')
              p.write_text(source.replace(old, new, 1))

          ui = 'src/entities/ui.js'
          replace(ui, """      async function persistActorAndRender(actor, { source = 'entities:actor.edit', render = false } = {}) {
            await upsertCanonicalActor(api, actor, { source, render });
            store.load({ migrateLegacy: false, dropMarkers: false });
            renderPanel();
            renderSheet();
          }""", """      async function persistActorAndRender(actor, { source = 'entities:actor.edit', render = false } = {}) {
            try {
              await upsertCanonicalActor(api, actor, { source, render });
              return true;
            } catch (error) {
              console.error('[RPGmap Entity UI] canonical Actor update failed', error);
              setStatus(`角色更新失败：${error?.message || error}`);
              return false;
            } finally {
              // Actor edits mutate an editor draft before submission. Always reload
              // the canonical World projection so a rejected LAN/revision write
              // cannot remain visible as an uncommitted local Actor value.
              store.load({ migrateLegacy: false, dropMarkers: false });
              renderPanel();
              renderSheet();
            }
          }""", 'persistActorAndRender rollback')

          replace(ui, """            await persistActorAndRender(actor, { source: 'entities:actor.form.import' });
            openSheet(actor.id);
            indicator(`${actor.name} · ${form?.name || formName}`);
            setStatus(`已导入 ${actor.name} 的新形态“${form?.name || formName}”`);""", """            if (!await persistActorAndRender(actor, { source: 'entities:actor.form.import' })) return;
            openSheet(actor.id);
            indicator(`${actor.name} · ${form?.name || formName}`);
            setStatus(`已导入 ${actor.name} 的新形态“${form?.name || formName}”`);""", 'form import success gate')

          replace(ui, """            await persistActorAndRender(actor, { source: 'entities:actor.create' });
            openSheet(actor.id);
            setStatus(`已创建角色“${actor.name}” · 可点击“放置棋子”放到地图`);""", """            if (!await persistActorAndRender(actor, { source: 'entities:actor.create' })) return;
            openSheet(actor.id);
            setStatus(`已创建角色“${actor.name}” · 可点击“放置棋子”放到地图`);""", 'imported Actor create success gate')

          replace(ui, """          await persistActorAndRender(actor, { source: 'entities:actor.create' });
          openSheet(actor.id);""", """          if (!await persistActorAndRender(actor, { source: 'entities:actor.create' })) return;
          openSheet(actor.id);""", 'blank Actor create success gate')

          replace(ui, """              await persistActorAndRender(actor, { source: 'entities:actor.form.cycle' });
              indicator(`${actor.name} · ${form.name}`);""", """              if (await persistActorAndRender(actor, { source: 'entities:actor.form.cycle' })) {
                indicator(`${actor.name} · ${form.name}`);
              }""", 'button form cycle success gate')

          replace(ui, """            await persistActorAndRender(actor, { source: 'entities:actor.form.select' });
            indicator(`${actor.name} · ${form.name}`);""", """            if (await persistActorAndRender(actor, { source: 'entities:actor.form.select' })) {
              indicator(`${actor.name} · ${form.name}`);
            }""", 'form select success gate')

          replace(ui, """        await persistActorAndRender(actor, { source: 'entities:actor.form.shortcut' });
        indicator(`${actor.name} · ${form.name}`);
        setStatus(`形态切换：${actor.name} → ${form.name}`);""", """        if (await persistActorAndRender(actor, { source: 'entities:actor.form.shortcut' })) {
          indicator(`${actor.name} · ${form.name}`);
          setStatus(`形态切换：${actor.name} → ${form.name}`);
        }""", 'shortcut form cycle success gate')

          test_path = Path('tests/entity-actor-operation-authority.test.js')
          test_source = test_path.read_text()
          test_source += """

test('Actor editor reloads canonical projection after failed World writes', () => {
  const source = readFileSync(path.join(ROOT, 'src/entities/ui.js'), 'utf8');
  assert.match(source, /catch \(error\)[\s\S]*canonical Actor update failed/);
  assert.match(source, /finally \{[\s\S]*store\.load\(\{ migrateLegacy: false, dropMarkers: false \}\)/);
  assert.match(source, /if \(!await persistActorAndRender\(actor, \{ source: 'entities:actor\.create' \}\)\) return/);
  assert.match(source, /if \(await persistActorAndRender\(actor, \{ source: 'entities:actor\.form\.shortcut' \}\)\)/);
});
"""
          test_path.write_text(test_source)

          port_path = Path('tests/actor-world-operation-port.test.js')
          port_source = port_path.read_text()
          port_source += """

test('canonical Actor upsert does not emit success when World rejects the write', async () => {
  const emitted = [];
  const api = {
    world: { async performOperations() { throw Object.assign(new Error('conflict'), { code: 'world_state_stale' }); } },
    emit(type, detail) { emitted.push({ type, detail }); },
  };
  await assert.rejects(upsertCanonicalActor(api, { id: 'actor-1', system: {}, effects: [] }), error => error?.code === 'world_state_stale');
  assert.deepEqual(emitted, []);
});
"""
          port_path.write_text(port_source)
          PY
      - run: npm test
      - name: Check JavaScript syntax
        run: find src deployment scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - run: npm run build
      - run: npm run package:local-server
      - name: Commit tested patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/entities/ui.js tests/entity-actor-operation-authority.test.js tests/actor-world-operation-port.test.js
          git commit -m "Rollback rejected Actor editor writes"
          git push origin HEAD:refactor/actor-world-operation-authority
