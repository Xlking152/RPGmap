name: Build RPGmap 1.5.3 Candidate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'reference/**'
      - 'tests/**'
      - 'deployment/local-server/**'
      - '文档/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/multiplayer-test-package.yml'
  push:
    branches:
      - feat/v1.5.0-map-package-framework
    paths:
      - 'src/**'
      - 'reference/**'
      - 'tests/**'
      - 'deployment/local-server/**'
      - '文档/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/multiplayer-test-package.yml'

permissions:
  contents: read

jobs:
  test-package-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      package_version: ${{ steps.package_metadata.outputs.package_version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src reference deployment/local-server -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Verify source separation
        shell: bash
        run: |
          set -euo pipefail
          test -f reference/README.md
          test -f reference/maps/lanzhou/manifest.js
          test -f reference/maps/lanzhou/package.js
          test -f reference/maps/lanzhou/assets.js
          test -d reference/maps/lanzhou/assets
          test -f reference/maps/minimal/package.js
          test -f src/map-package/contract.js
          test -f src/map-package/default-map.js
          test ! -d src/assets/generated
          ! grep -Eq 'lanzhou|Lanzhou|assets/generated' src/main.js
          grep -q 'createDefaultMapPackage' src/main.js

      - name: Verify launcher consolidation
        shell: bash
        run: |
          set -euo pipefail
          test -f deployment/local-server/launcher.mjs
          test -f deployment/local-server/start-rpgmap.bat
          test ! -e deployment/local-server/local-launcher.mjs
          test ! -e deployment/local-server/internet-launcher.mjs
          test ! -e deployment/local-server/launcher-guard.mjs
          test ! -e deployment/local-server/start-rpgmap-internet.bat
          test ! -e deployment/local-server/setup-cloudflared.bat
          test ! -e deployment/local-server/run-rpgmap-public-server.bat

      - name: Build web client
        run: npm run build

      - name: Verify bundled default map
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          grep -q 'northern-song-lanzhou-1104' dist/index.html
          test "$(wc -c < dist/index.html)" -gt 500000

      - name: Resolve package metadata
        id: package_metadata
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          SOURCE_COMMIT="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=${SOURCE_COMMIT}" >> "$GITHUB_ENV"
          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Assemble RPGmap package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/artifact/RPGmap-v${PACKAGE_VERSION}"
          rm -rf "$GITHUB_WORKSPACE/artifact"
          mkdir -p "$ROOT/app" "$ROOT/map/uploads" "$ROOT/map/backups" "$ROOT/docs"

          cp -R dist/. "$ROOT/app/"
          cp -R reference "$ROOT/reference"
          cp deployment/local-server/server.mjs "$ROOT/server.mjs"
          cp deployment/local-server/access-control.mjs "$ROOT/access-control.mjs"
          cp deployment/local-server/portable-storage.mjs "$ROOT/portable-storage.mjs"
          cp deployment/local-server/launcher.mjs "$ROOT/launcher.mjs"
          cp deployment/local-server/start-rpgmap.bat "$ROOT/start-rpgmap.bat"
          cp deployment/local-server/start-rpgmap.sh "$ROOT/start-rpgmap.sh"
          cp deployment/local-server/README.md "$ROOT/README.md"
          cp deployment/local-server/INTERNET-TEST.md "$ROOT/INTERNET-MULTIPLAYER.md"
          cp deployment/local-server/map/README.txt "$ROOT/map/README.txt"
          cp '文档/联机使用说明.md' "$ROOT/docs/MULTIPLAYER-GUIDE.md"
          cp CHANGELOG.md "$ROOT/docs/CHANGELOG.md"
          chmod +x "$ROOT/start-rpgmap.sh"

          cat > "$ROOT/VERSION.json" <<EOF
          {
            "app": "RPGmap",
            "version": "${PACKAGE_VERSION}",
            "commit": "${SOURCE_COMMIT}",
            "serverMode": "multiplayer",
            "storageMode": "portable-map-root-v1.4.1-compatible",
            "mapPackageApiVersion": 1,
            "defaultMapSource": "reference/maps/lanzhou",
            "runtimeMapMode": "bundled-at-build-time",
            "launcherMode": "single-entry-v1",
            "defaultPort": 30000
          }
          EOF

          test -f "$ROOT/app/index.html"
          test -f "$ROOT/reference/README.md"
          test -f "$ROOT/reference/maps/lanzhou/package.js"
          test -f "$ROOT/reference/maps/minimal/package.js"
          test -f "$ROOT/server.mjs"
          test -f "$ROOT/launcher.mjs"
          test -f "$ROOT/start-rpgmap.bat"
          test "$(find "$ROOT" -maxdepth 1 -type f -name '*.bat' | wc -l)" -eq 1
          test ! -e "$ROOT/start-rpgmap-internet.bat"
          test ! -e "$ROOT/setup-cloudflared.bat"
          test ! -e "$ROOT/run-rpgmap-public-server.bat"
          test -f "$ROOT/map/README.txt"
          test -d "$ROOT/map/uploads"
          test -d "$ROOT/map/backups"
          test ! -d "$ROOT/data"
          test ! -d "$ROOT/maps"
          test "$(node -p "require('$ROOT/VERSION.json').commit")" = "$SOURCE_COMMIT"
          test "$(node -p "require('$ROOT/VERSION.json').version")" = "$PACKAGE_VERSION"

      - name: Runtime smoke without reference sources
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/artifact/RPGmap-v${PACKAGE_VERSION}"
          SMOKE="$GITHUB_WORKSPACE/runtime-smoke"
          rm -rf "$SMOKE"
          cp -R "$ROOT" "$SMOKE"
          rm -rf "$SMOKE/reference"
          test ! -d "$SMOKE/reference"

          export PORT=31000
          export RPGMAP_PUBLIC_DIR="$SMOKE/app"
          export RPGMAP_MAP_DIR="$SMOKE/map"
          node "$SMOKE/server.mjs" > "$GITHUB_WORKSPACE/runtime-smoke.log" 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          READY=0
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:${PORT}/api/health" > "$GITHUB_WORKSPACE/health.json"; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [ "$READY" -ne 1 ]; then
            cat "$GITHUB_WORKSPACE/runtime-smoke.log"
            exit 1
          fi

          curl -fsS "http://127.0.0.1:${PORT}/" > "$GITHUB_WORKSPACE/runtime-index.html"
          grep -q 'northern-song-lanzhou-1104' "$GITHUB_WORKSPACE/runtime-index.html"
          node -e "const h=require('fs').readFileSync(process.env.GITHUB_WORKSPACE+'/health.json','utf8'); const j=JSON.parse(h); if(j.status!=='ok') process.exit(1)"
          cleanup
          trap - EXIT
          rm -rf "$SMOKE"

      - name: Archive and verify package
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/artifact"
          ARCHIVE="RPGmap-v${PACKAGE_VERSION}.zip"
          zip -r -9 -q "$ARCHIVE" "RPGmap-v${PACKAGE_VERSION}"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          unzip -l "$ARCHIVE" | grep 'reference/maps/lanzhou/package.js'
          unzip -l "$ARCHIVE" | grep 'reference/maps/minimal/package.js'
          unzip -l "$ARCHIVE" | grep 'app/index.html'
          unzip -l "$ARCHIVE" | grep 'launcher.mjs'
          unzip -l "$ARCHIVE" | grep 'start-rpgmap.bat'
          ! unzip -l "$ARCHIVE" | grep -E 'start-rpgmap-internet\.bat|setup-cloudflared\.bat|run-rpgmap-public-server\.bat|local-launcher\.mjs|internet-launcher\.mjs|launcher-guard\.mjs'

      - name: Upload RPGmap package
        uses: actions/upload-artifact@v4
        with:
          name: RPGmap-v${{ env.PACKAGE_VERSION }}
          path: |
            artifact/RPGmap-v${{ env.PACKAGE_VERSION }}.zip
            artifact/RPGmap-v${{ env.PACKAGE_VERSION }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

  windows-bat-smoke:
    needs: test-package-runtime
    runs-on: windows-latest
    timeout-minutes: 8

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Download packaged artifact
        uses: actions/download-artifact@v4
        with:
          name: RPGmap-v${{ needs.test-package-runtime.outputs.package_version }}
          path: smoke

      - name: Run single packaged BAT in Local mode
        shell: powershell
        env:
          PACKAGE_VERSION: ${{ needs.test-package-runtime.outputs.package_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "smoke/RPGmap-v$env:PACKAGE_VERSION.zip"
          $packageDir = "smoke/package/RPGmap-v$env:PACKAGE_VERSION"
          Expand-Archive -Path $archive -DestinationPath 'smoke/package' -Force
          $root = (Resolve-Path $packageDir).Path
          $version = Get-Content (Join-Path $root 'VERSION.json') -Raw | ConvertFrom-Json
          if ($version.version -ne $env:PACKAGE_VERSION) { throw 'VERSION.json does not match workflow package version' }
          $bats = @(Get-ChildItem -Path $root -Filter '*.bat' -File)
          if ($bats.Count -ne 1 -or $bats[0].Name -ne 'start-rpgmap.bat') { throw 'Package must expose exactly one Windows BAT: start-rpgmap.bat' }
          $reference = Join-Path $root 'reference'
          if (Test-Path $reference) { Remove-Item $reference -Recurse -Force }
          if (Test-Path $reference) { throw 'reference directory still exists before Windows runtime smoke' }

          $bootstrap = Start-Process -FilePath 'cmd.exe' -ArgumentList @('/d','/c','call start-rpgmap.bat local') -WorkingDirectory $root -PassThru
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $health = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:30000/api/health' -TimeoutSec 1
              $healthJson = $health.Content | ConvertFrom-Json
              $index = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:30000/' -TimeoutSec 1
              if ($health.StatusCode -eq 200 -and -not $healthJson.multiplayer.publicMode -and $index.StatusCode -eq 200 -and $index.Content -match 'northern-song-lanzhou-1104') {
                $ready = $true
                break
              }
            } catch {}
            if ($bootstrap.HasExited) { break }
            Start-Sleep -Milliseconds 250
          }

          if (-not $ready) {
            if ($bootstrap.HasExited) { Write-Host "BAT exit code: $($bootstrap.ExitCode)" }
            throw 'Single packaged start-rpgmap.bat did not serve the bundled client in Local/LAN mode.'
          }

          $previousPreference = $ErrorActionPreference
          $ErrorActionPreference = 'SilentlyContinue'
          & taskkill.exe /PID $bootstrap.Id /T /F *> $null
          $ErrorActionPreference = $previousPreference
          $global:LASTEXITCODE = 0
