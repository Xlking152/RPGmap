name: Build RPGmap 1.4 Package

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'deployment/local-server/**'
      - '文档/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/multiplayer-test-package.yml'
  push:
    branches:
      - feat/multiplayer-v1
    paths:
      - 'src/**'
      - 'tests/**'
      - 'deployment/local-server/**'
      - '文档/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/multiplayer-test-package.yml'

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src deployment/local-server -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Build web client
        run: npm run build

      - name: Resolve package version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"

      - name: Assemble RPGmap package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/artifact/RPGmap-v${PACKAGE_VERSION}"
          rm -rf "$GITHUB_WORKSPACE/artifact"
          mkdir -p "$ROOT/public" "$ROOT/data/worlds" "$ROOT/data/uploads" "$ROOT/data/backups" "$ROOT/docs"

          cp -R dist/. "$ROOT/public/"
          cp deployment/local-server/server.mjs "$ROOT/server.mjs"
          cp deployment/local-server/internet-launcher.mjs "$ROOT/internet-launcher.mjs"
          cp deployment/local-server/start-rpgmap.bat "$ROOT/start-rpgmap.bat"
          cp deployment/local-server/start-rpgmap.sh "$ROOT/start-rpgmap.sh"
          cp deployment/local-server/start-rpgmap-internet.bat "$ROOT/start-rpgmap-internet.bat"
          cp deployment/local-server/setup-cloudflared.bat "$ROOT/setup-cloudflared.bat"
          cp deployment/local-server/run-rpgmap-public-server.bat "$ROOT/run-rpgmap-public-server.bat"
          cp deployment/local-server/README.md "$ROOT/README.md"
          cp deployment/local-server/INTERNET-TEST.md "$ROOT/INTERNET-MULTIPLAYER.md"
          cp deployment/local-server/data/README.txt "$ROOT/data/README.txt"
          cp '文档/联机使用说明.md' "$ROOT/docs/MULTIPLAYER-GUIDE.md"
          cp CHANGELOG.md "$ROOT/docs/CHANGELOG.md"
          chmod +x "$ROOT/start-rpgmap.sh"

          cat > "$ROOT/VERSION.json" <<EOF
          {
            "app": "RPGmap",
            "version": "${PACKAGE_VERSION}",
            "commit": "${GITHUB_SHA}",
            "serverMode": "multiplayer",
            "defaultPort": 30000
          }
          EOF

          test -f "$ROOT/public/index.html"
          test -f "$ROOT/server.mjs"
          test -f "$ROOT/internet-launcher.mjs"
          test -f "$ROOT/start-rpgmap-internet.bat"
          test -f "$ROOT/setup-cloudflared.bat"
          test -f "$ROOT/docs/MULTIPLAYER-GUIDE.md"

          cd "$GITHUB_WORKSPACE/artifact"
          ARCHIVE="RPGmap-v${PACKAGE_VERSION}.zip"
          zip -r -9 -q "$ARCHIVE" "RPGmap-v${PACKAGE_VERSION}"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Upload RPGmap package
        uses: actions/upload-artifact@v4
        with:
          name: RPGmap-v${{ env.PACKAGE_VERSION }}
          path: |
            artifact/RPGmap-v${{ env.PACKAGE_VERSION }}.zip
            artifact/RPGmap-v${{ env.PACKAGE_VERSION }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
