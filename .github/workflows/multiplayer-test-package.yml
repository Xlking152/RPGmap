name: Build RPGmap Candidate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - name: Check JavaScript syntax
        shell: bash
        run: find src deployment/local-server scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - run: npm run build
      - run: npm run package:local-server
      - name: Verify Windows package contents
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          ROOT="artifact/RPGmap-v${VERSION}"
          test -f "$ROOT/start-rpgmap.bat"
          test -f "$ROOT/world-schema.mjs"
          test -f "$ROOT/status-operations.mjs"
          test -f "$ROOT/app/index.html"
          test -d "$ROOT/map/backups"
          (cd artifact && sha256sum -c "RPGmap-v${VERSION}.zip.sha256")
          test "$(find "$ROOT" -maxdepth 1 -name '*.bat' | wc -l)" -eq 1
          test ! -e "$ROOT/cloudflared.exe"
          test ! -e "$ROOT/start-rpgmap.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: RPGmap-candidate-v${{ github.sha }}
          path: |
            artifact/RPGmap-v*.zip
            artifact/RPGmap-v*.zip.sha256
          if-no-files-found: error

  windows-smoke:
    needs: candidate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run package:local-server
      - name: Start packaged Local/LAN server and verify health
        shell: pwsh
        run: |
          $env:RPGMAP_NO_BROWSER = '1'
          $version = node -p "require('./package.json').version"
          $root = Join-Path $PWD "artifact/RPGmap-v$version"
          $launcher = Start-Process -FilePath 'cmd.exe' -ArgumentList @('/D', '/S', '/C', 'start-rpgmap.bat') -WorkingDirectory $root -PassThru -WindowStyle Hidden
          try {
            $health = $null
            for ($attempt = 0; $attempt -lt 40; $attempt += 1) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:30000/api/health' -TimeoutSec 2
                if ($health.status -eq 'ok' -and $health.multiplayer.enabled -eq $true -and $health.multiplayer.publicMode -eq $false) { break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if ($null -eq $health -or $health.status -ne 'ok') { throw 'Packaged server did not pass /api/health smoke test.' }
          } finally {
            if (-not $launcher.HasExited) { & taskkill.exe /PID $launcher.Id /T /F | Out-Null }
          }
