name: Build RPGmap Candidate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Only the newest commit for a PR/ref needs a packaged Windows smoke. This
# prevents obsolete red runs from piling up while a refactor is being pushed.
concurrency:
  group: rpgmap-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - name: Check JavaScript syntax
        shell: bash
        run: find src deployment/local-server scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - run: npm run build
      - run: npm run package:local-server
      - name: Verify Windows package contents
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          ROOT="artifact/RPGmap-v${VERSION}"
          test -f "$ROOT/start-rpgmap.bat"
          test -f "$ROOT/launcher.mjs"
          test -f "$ROOT/server.mjs"
          test -f "$ROOT/access-control.mjs"
          test -f "$ROOT/portable-storage.mjs"
          test -f "$ROOT/world-schema.mjs"
          test -f "$ROOT/world-v2.mjs"
          test -f "$ROOT/status-operations.mjs"
          test -f "$ROOT/app/index.html"
          test -d "$ROOT/map/backups"
          (cd artifact && sha256sum -c "RPGmap-v${VERSION}.zip.sha256")
          test "$(find "$ROOT" -maxdepth 1 -name '*.bat' | wc -l)" -eq 1
          test ! -e "$ROOT/cloudflared.exe"
          test ! -e "$ROOT/start-rpgmap.sh"
      - uses: actions/upload-artifact@v7
        with:
          name: RPGmap-candidate-v${{ github.sha }}
          path: |
            artifact/RPGmap-v*.zip
            artifact/RPGmap-v*.zip.sha256
          if-no-files-found: error

  windows-smoke:
    needs: candidate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run package:local-server
      - name: Start packaged Local/LAN server and verify health
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $root = Join-Path $PWD "artifact/RPGmap-v$version"
          & ./scripts/windows-smoke.ps1 -Root $root -TimeoutSeconds 30
