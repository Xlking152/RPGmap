name: Build RPGmap 1.4.3 Package

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'deployment/local-server/**'
      - 'deployment/launcher/**'
      - '文档/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/multiplayer-test-package.yml'
  push:
    branches: [feat/v1.4.3-launcher-admin]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'deployment/local-server/**'
      - 'deployment/launcher/**'
      - '文档/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/multiplayer-test-package.yml'

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src deployment/local-server deployment/launcher scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Build web client
        run: npm run build

      - name: Resolve package version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          SOURCE_COMMIT="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=${SOURCE_COMMIT}" >> "$GITHUB_ENV"

      - name: Assemble RPGmap package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/artifact/RPGmap-v${PACKAGE_VERSION}"
          rm -rf "$GITHUB_WORKSPACE/artifact"
          mkdir -p "$ROOT/app" "$ROOT/launcher" "$ROOT/server" "$ROOT/world/uploads" "$ROOT/world/backups" "$ROOT/maps" "$ROOT/docs" "$ROOT/tools"

          cp -R dist/. "$ROOT/app/"
          cp deployment/launcher/start-rpgmap.bat "$ROOT/RPGmap.bat"
          cp deployment/launcher/rpgmap-runtime.ps1 "$ROOT/launcher/rpgmap-runtime.ps1"
          cp deployment/launcher/launcher.mjs "$ROOT/launcher/launcher.mjs"
          cp deployment/launcher/admin-client.mjs "$ROOT/launcher/admin-client.mjs"
          cp deployment/launcher/index.html "$ROOT/launcher/index.html"
          cp deployment/launcher/launcher.js "$ROOT/launcher/launcher.js"
          cp deployment/launcher/launcher.css "$ROOT/launcher/launcher.css"

          cp deployment/local-server/server.mjs "$ROOT/server/server.mjs"
          cp deployment/local-server/access-control.mjs "$ROOT/server/access-control.mjs"
          cp deployment/local-server/portable-storage.mjs "$ROOT/server/portable-storage.mjs"

          node scripts/export-maps.mjs "$ROOT/maps"
          cp deployment/local-server/maps/README.txt "$ROOT/maps/README.txt"

          cp 'deployment/local-server/操作说明.md' "$ROOT/操作说明.md"
          cp deployment/local-server/INTERNET-TEST.md "$ROOT/docs/INTERNET-MULTIPLAYER.md"
          cp deployment/local-server/world/README.txt "$ROOT/world/README.txt"
          cp '文档/联机使用说明.md' "$ROOT/docs/MULTIPLAYER-GUIDE.md"
          cp '文档/未来规划.md' "$ROOT/docs/FUTURE-ROADMAP.md"
          cp CHANGELOG.md "$ROOT/docs/CHANGELOG.md"

          cat > "$ROOT/VERSION.json" <<EOF
          {
            "app": "RPGmap",
            "version": "${PACKAGE_VERSION}",
            "commit": "${SOURCE_COMMIT}",
            "serverMode": "multiplayer",
            "storageMode": "portable-world-maps",
            "mapPackageMode": "external-runtime-maps",
            "defaultMapId": "northern-song-lanzhou-1104",
            "launcherMode": "single-bat-powershell-web-admin-console",
            "defaultPort": 30000,
            "preferredLauncherPort": 29999,
            "launcherPortMode": "dynamic-loopback"
          }
          EOF

          test -f "$ROOT/app/index.html"
          test -f "$ROOT/RPGmap.bat"
          test -f "$ROOT/launcher/rpgmap-runtime.ps1"
          test -f "$ROOT/launcher/launcher.mjs"
          test -f "$ROOT/server/server.mjs"
          test -f "$ROOT/操作说明.md"
          test -f "$ROOT/world/README.txt"
          test -f "$ROOT/maps/README.txt"
          test -f "$ROOT/maps/index.json"
          test -f "$ROOT/maps/northern-song-lanzhou-1104/map.json"
          test -d "$ROOT/maps/northern-song-lanzhou-1104/assets"
          test "$(find "$ROOT/maps/northern-song-lanzhou-1104/assets" -type f -iname '*.webp' | wc -l)" -ge 20
          test "$(node -p "require('$ROOT/maps/index.json').defaultMapId")" = "northern-song-lanzhou-1104"
          test "$(node -p "require('$ROOT/maps/northern-song-lanzhou-1104/map.json').runtimeSource")" = "external-maps-directory"
          if grep -R -F '崇宁三年（1104）· 游戏比例地图' "$ROOT/app" >/dev/null 2>&1; then
            echo 'Map-specific Lanzhou markup is still bundled into app/.' >&2
            exit 1
          fi
          test -f "$ROOT/docs/FUTURE-ROADMAP.md"
          test ! -d "$ROOT/map"
          test ! -d "$ROOT/data"
          test ! -d "$ROOT/public"
          test ! -f "$ROOT/README.md"
          test "$(find "$ROOT" -maxdepth 1 -type f -iname '*.bat' | wc -l)" -eq 1
          test "$(find "$ROOT" -maxdepth 1 -type f -iname '*.exe' | wc -l)" -eq 0

          cd "$GITHUB_WORKSPACE/artifact"
          ARCHIVE="RPGmap-v${PACKAGE_VERSION}.zip"
          python - <<'PY'
          from pathlib import Path
          import os, zipfile
          artifact = Path(os.environ['GITHUB_WORKSPACE']) / 'artifact'
          version = os.environ['PACKAGE_VERSION']
          root = artifact / f'RPGmap-v{version}'
          archive = artifact / f'RPGmap-v{version}.zip'
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for item in sorted(root.rglob('*')):
                  arcname = item.relative_to(artifact).as_posix()
                  if item.is_dir():
                      zf.writestr(arcname.rstrip('/') + '/', b'')
                  else:
                      zf.write(item, arcname)
          PY
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

          VERIFY="$GITHUB_WORKSPACE/artifact/verify"
          rm -rf "$VERIFY"
          mkdir -p "$VERIFY"
          python - <<'PY'
          from pathlib import Path
          import os, zipfile
          artifact = Path(os.environ['GITHUB_WORKSPACE']) / 'artifact'
          version = os.environ['PACKAGE_VERSION']
          with zipfile.ZipFile(artifact / f'RPGmap-v{version}.zip') as zf:
              zf.extractall(artifact / 'verify')
          PY
          VROOT="$VERIFY/RPGmap-v${PACKAGE_VERSION}"
          test -f "$VROOT/RPGmap.bat"
          test -f "$VROOT/launcher/rpgmap-runtime.ps1"
          test -f "$VROOT/操作说明.md"
          test -f "$VROOT/launcher/launcher.mjs"
          test -f "$VROOT/server/server.mjs"
          test -f "$VROOT/app/index.html"
          test -f "$VROOT/maps/index.json"
          test -f "$VROOT/maps/northern-song-lanzhou-1104/map.json"
          test -f "$VROOT/maps/northern-song-lanzhou-1104/assets/yellow-river.webp"
          test -f "$VROOT/maps/northern-song-lanzhou-1104/assets/rubble-atlas.webp"
          test -f "$VROOT/docs/FUTURE-ROADMAP.md"
          test "$(find "$VROOT" -maxdepth 1 -type f -iname '*.bat' | wc -l)" -eq 1
          test "$(find "$VROOT" -maxdepth 1 -type f -iname '*.exe' | wc -l)" -eq 0
          test "$(node -p "require('$VROOT/VERSION.json').commit")" = "$SOURCE_COMMIT"
          test "$(node -p "require('$VROOT/VERSION.json').launcherMode")" = "single-bat-powershell-web-admin-console"
          test "$(node -p "require('$VROOT/VERSION.json').launcherPortMode")" = "dynamic-loopback"
          test "$(node -p "require('$VROOT/VERSION.json').mapPackageMode")" = "external-runtime-maps"
          rm -rf "$VERIFY"

      - name: Upload RPGmap package
        uses: actions/upload-artifact@v4
        with:
          name: RPGmap-v${{ env.PACKAGE_VERSION }}
          path: |
            artifact/RPGmap-v${{ env.PACKAGE_VERSION }}.zip
            artifact/RPGmap-v${{ env.PACKAGE_VERSION }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

  windows-bat-smoke:
    needs: test-and-package
    runs-on: windows-latest
    timeout-minutes: 8

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Download packaged artifact
        uses: actions/download-artifact@v4
        with:
          name: RPGmap-v1.4.3
          path: smoke

      - name: Launch RPGmap.bat and verify external maps
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -Path 'smoke/RPGmap-v1.4.3.zip' -DestinationPath 'smoke/package' -Force
          $root = (Resolve-Path 'smoke/package/RPGmap-v1.4.3').Path
          $log = Join-Path $root 'launcher-startup.log'
          $blockerScript = Join-Path $root 'block-port.js'
          Set-Content -Path $blockerScript -Encoding UTF8 -Value 'const net=require("net"); const s=net.createServer(()=>{}); s.listen(29999,"127.0.0.1"); setInterval(()=>{},1000);'

          $node = (Get-Command node.exe).Source
          $blocker = Start-Process -FilePath $node -ArgumentList @($blockerScript) -WorkingDirectory $root -PassThru
          Start-Sleep -Milliseconds 700

          $bootstrap = Start-Process -FilePath 'cmd.exe' -ArgumentList @('/d','/c','call RPGmap.bat') -WorkingDirectory $root -PassThru

          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:29998/' -TimeoutSec 1
              if ($response.StatusCode -eq 200 -and $response.Content -match 'RPGmap Launcher') {
                $ready = $true
                break
              }
            } catch {}
            if ($bootstrap.HasExited) { break }
            Start-Sleep -Milliseconds 250
          }

          if (-not $ready) {
            if (Test-Path $log) { Get-Content $log }
            if ($bootstrap.HasExited) { Write-Host "BAT runtime exit code: $($bootstrap.ExitCode)" }
            throw 'RPGmap.bat did not start the Launcher on fallback port 29998.'
          }

          $rootMaps = Join-Path $root 'maps'
          $mapIndex = Join-Path $rootMaps 'index.json'
          $mapManifest = Join-Path $rootMaps 'northern-song-lanzhou-1104\map.json'
          if (-not (Test-Path $mapIndex)) { throw 'maps/index.json is missing.' }
          if (-not (Test-Path $mapManifest)) { throw 'external Lanzhou map.json is missing.' }

          $mount = Get-Item -LiteralPath (Join-Path $root 'app\maps') -Force
          if (($mount.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0) {
            throw 'app/maps is not a runtime junction to root maps/.'
          }
          if (-not (Test-Path (Join-Path $root 'app\maps\index.json'))) {
            throw 'app/maps junction cannot reach root maps/index.json.'
          }

          $serverEnv = @{
            RPGMAP_PACKAGE_ROOT = $root
            RPGMAP_PUBLIC_DIR = (Join-Path $root 'app')
            RPGMAP_WORLD_DIR = (Join-Path $root 'world')
            RPGMAP_MAPS_DIR = (Join-Path $root 'maps')
            PORT = '30000'
          }
          foreach ($entry in $serverEnv.GetEnumerator()) { [Environment]::SetEnvironmentVariable($entry.Key, $entry.Value, 'Process') }
          $server = Start-Process -FilePath $node -ArgumentList @((Join-Path $root 'server\server.mjs')) -WorkingDirectory $root -PassThru
          $mapServed = $false
          for ($i = 0; $i -lt 40; $i++) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:30000/maps/index.json' -TimeoutSec 1
              if ($response.StatusCode -eq 200 -and $response.Content -match 'northern-song-lanzhou-1104') {
                $mapServed = $true
                break
              }
            } catch {}
            Start-Sleep -Milliseconds 250
          }
          if (-not $mapServed) { throw 'Game Server could not serve root maps through the runtime junction.' }

          Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $blocker.Id -Force -ErrorAction SilentlyContinue
          & taskkill.exe /PID $bootstrap.Id /T /F 2>$null | Out-Null
