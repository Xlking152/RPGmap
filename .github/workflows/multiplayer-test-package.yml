name: Build RPGmap Candidate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Only the newest commit for a PR/ref needs a packaged Windows smoke. This
# prevents obsolete red runs from piling up while a refactor is being pushed.
concurrency:
  group: rpgmap-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
      - run: npm audit --registry=https://registry.npmjs.org --omit=dev --audit-level=high
      - run: npm test
      - name: Check JavaScript syntax
        shell: bash
        run: git ls-files -z -- '*.js' '*.mjs' | xargs -0 -n1 node --check
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run package:local-server
        env:
          RPGMAP_SOURCE_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: RPGmap-candidate-v${{ github.sha }}
          path: |
            artifact/RPGmap-v*.zip
            artifact/RPGmap-v*.zip.sha256
          if-no-files-found: error

  windows-smoke:
    needs: candidate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run package:local-server
        env:
          RPGMAP_SOURCE_COMMIT: ${{ github.sha }}
      - name: Verify packaged Local/LAN server, World Manager and Lanzhou Runtime
        id: packaged-smoke
        shell: pwsh
        env:
          # v2.5.5 release performance is verified on the user's machine and
          # exact final ZIP. This different hosted machine records frame data;
          # functionality, feedback, long tasks and recovery remain asserted.
          RPGMAP_SMOKE_HOSTED_FRAME_OBSERVATION: '1'
        run: |
          node scripts/vision-mask-raster-check.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Continuous mask raster equivalence failed.' }
          $version = node -p "require('./package.json').version"
          $root = Join-Path $PWD "artifact/RPGmap-v$version"
          & ./scripts/windows-smoke.ps1 -Root $root -TimeoutSeconds 30 -Browser chrome -SingleAttempt
      - name: Diagnose failed Chrome destruction stress without promoting its measurements
        if: failure() && steps.packaged-smoke.outcome == 'failure'
        continue-on-error: true
        shell: pwsh
        env:
          RPGMAP_SMOKE_RUINS_CPU_PROFILE: artifact/ruins-ci-diagnostic.cpuprofile
        run: |
          $version = node -p "require('./package.json').version"
          $root = Join-Path $PWD "artifact/RPGmap-v$version"
          & ./scripts/windows-smoke.ps1 -Root $root -TimeoutSeconds 30 -Browser chrome -SingleAttempt
      - name: Retain failed Chrome CPU diagnostics
        if: always() && steps.packaged-smoke.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: Chrome-destruction-diagnostic-${{ github.sha }}
          path: artifact/ruins-ci-diagnostic.cpuprofile*
          if-no-files-found: warn
