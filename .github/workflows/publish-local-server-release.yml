name: Publish RPGmap Windows Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          node -e "const v='${VERSION}'.split('.').map(Number); if (v.length !== 3 || v.some(n => !Number.isInteger(n)) || v[0] < 1 || (v[0] === 1 && (v[1] < 5 || (v[1] === 5 && v[2] < 6)))) process.exit(1)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm run package:local-server
        env:
          RPGMAP_SOURCE_COMMIT: ${{ steps.meta.outputs.commit }}
      - name: Archive candidate
        shell: bash
        run: |
          set -euo pipefail
          cd artifact
          sha256sum -c "RPGmap-v${{ steps.meta.outputs.version }}.zip.sha256"
          test "$(node -p "require('./RPGmap-v${{ steps.meta.outputs.version }}/VERSION.json').version")" = "${{ steps.meta.outputs.version }}"
          test "$(node -p "require('./RPGmap-v${{ steps.meta.outputs.version }}/VERSION.json').commit")" = "${{ steps.meta.outputs.commit }}"
          ROOT="RPGmap-v${{ steps.meta.outputs.version }}"
          test -f "$ROOT/start-rpgmap.bat"
          test -f "$ROOT/launcher.mjs"
          test -f "$ROOT/server.mjs"
          test -f "$ROOT/access-control.mjs"
          test -f "$ROOT/portable-storage.mjs"
          test -f "$ROOT/world-schema.mjs"
          test -f "$ROOT/world-v2.mjs"
          test -f "$ROOT/status-operations.mjs"
          test -f "$ROOT/world-operations.mjs"
          test -f "$ROOT/app/index.html"
          test "$(find "$ROOT" -maxdepth 1 -name '*.bat' | wc -l)" -eq 1
          test ! -e "$ROOT/cloudflared.exe"
          test ! -e "$ROOT/start-rpgmap.sh"
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-v${{ steps.meta.outputs.version }}
          path: |
            artifact/RPGmap-v${{ steps.meta.outputs.version }}.zip
            artifact/RPGmap-v${{ steps.meta.outputs.version }}.zip.sha256
          if-no-files-found: error

  windows-smoke:
    needs: candidate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-v${{ needs.candidate.outputs.version }}
          path: release
      - name: Verify and launch the candidate ZIP
        shell: pwsh
        run: |
          $version = '${{ needs.candidate.outputs.version }}'
          $zip = Join-Path $PWD "release/RPGmap-v$version.zip"
          $checksum = Join-Path $PWD "release/RPGmap-v$version.zip.sha256"
          $expected = (Get-Content -LiteralPath $checksum -Raw).Split(' ')[0].Trim().ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Candidate ZIP checksum mismatch.' }
          Expand-Archive -LiteralPath $zip -DestinationPath release/unpacked -Force
          $root = Join-Path $PWD "release/unpacked/RPGmap-v$version"
          & ./scripts/windows-smoke.ps1 -Root $root -TimeoutSeconds 30

  publish:
    needs: [candidate, windows-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-v${{ needs.candidate.outputs.version }}
          path: release
      - name: Verify candidate checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c "RPGmap-v${{ needs.candidate.outputs.version }}.zip.sha256"
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.candidate.outputs.version }}" \
            "release/RPGmap-v${{ needs.candidate.outputs.version }}.zip" \
            "release/RPGmap-v${{ needs.candidate.outputs.version }}.zip.sha256" \
            --target "${{ needs.candidate.outputs.commit }}" --title "RPGmap ${{ needs.candidate.outputs.version }}" \
            --notes "Windows Local/LAN release built and checksum-verified from ${{ needs.candidate.outputs.commit }}."
