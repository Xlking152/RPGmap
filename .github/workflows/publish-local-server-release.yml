name: Publish RPGmap Version Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-local-server-release.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install clean dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src deployment/local-server deployment/launcher scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Build web client
        run: npm run build

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          RELEASE_TAG="v${PACKAGE_VERSION}"
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Refuse duplicate version release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Increase the application version before publishing another release." >&2
            exit 1
          fi

      - name: Assemble clean package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/release/RPGmap-v${PACKAGE_VERSION}"
          rm -rf "$GITHUB_WORKSPACE/release"
          mkdir -p "$ROOT/app" "$ROOT/launcher" "$ROOT/server" "$ROOT/world/uploads" "$ROOT/world/backups" "$ROOT/maps" "$ROOT/docs" "$ROOT/tools"

          cp -R dist/. "$ROOT/app/"
          cp deployment/launcher/start-rpgmap.bat "$ROOT/RPGmap.bat"
          cp deployment/launcher/rpgmap-runtime.ps1 "$ROOT/launcher/rpgmap-runtime.ps1"
          cp deployment/launcher/launcher.mjs "$ROOT/launcher/launcher.mjs"
          cp deployment/launcher/admin-client.mjs "$ROOT/launcher/admin-client.mjs"
          cp deployment/launcher/index.html "$ROOT/launcher/index.html"
          cp deployment/launcher/launcher.js "$ROOT/launcher/launcher.js"
          cp deployment/launcher/launcher.css "$ROOT/launcher/launcher.css"

          cp deployment/local-server/server.mjs "$ROOT/server/server.mjs"
          cp deployment/local-server/access-control.mjs "$ROOT/server/access-control.mjs"
          cp deployment/local-server/portable-storage.mjs "$ROOT/server/portable-storage.mjs"

          node scripts/export-maps.mjs "$ROOT/maps"
          cp deployment/local-server/maps/README.txt "$ROOT/maps/README.txt"

          cp 'deployment/local-server/操作说明.md' "$ROOT/操作说明.md"
          cp deployment/local-server/INTERNET-TEST.md "$ROOT/docs/INTERNET-MULTIPLAYER.md"
          cp deployment/local-server/world/README.txt "$ROOT/world/README.txt"
          cp '文档/联机使用说明.md' "$ROOT/docs/MULTIPLAYER-GUIDE.md"
          cp '文档/未来规划.md' "$ROOT/docs/FUTURE-ROADMAP.md"
          cp CHANGELOG.md "$ROOT/docs/CHANGELOG.md"

          cat > "$ROOT/VERSION.json" <<EOF
          {
            "app": "RPGmap",
            "version": "${PACKAGE_VERSION}",
            "releaseTag": "${RELEASE_TAG}",
            "commit": "${GITHUB_SHA}",
            "serverMode": "multiplayer",
            "storageMode": "portable-world-maps",
            "mapPackageMode": "external-runtime-maps",
            "defaultMapId": "northern-song-lanzhou-1104",
            "launcherMode": "single-bat-powershell-web-admin-console",
            "defaultPort": 30000,
            "preferredLauncherPort": 29999,
            "launcherPortMode": "dynamic-loopback"
          }
          EOF

          test -f "$ROOT/RPGmap.bat"
          test -f "$ROOT/launcher/rpgmap-runtime.ps1"
          test -f "$ROOT/操作说明.md"
          test -f "$ROOT/app/index.html"
          test -f "$ROOT/launcher/launcher.mjs"
          test -f "$ROOT/server/server.mjs"
          test -f "$ROOT/world/README.txt"
          test -f "$ROOT/maps/README.txt"
          test -f "$ROOT/maps/index.json"
          test -f "$ROOT/maps/northern-song-lanzhou-1104/map.json"
          test -f "$ROOT/maps/northern-song-lanzhou-1104/assets/yellow-river.webp"
          test -f "$ROOT/maps/northern-song-lanzhou-1104/assets/rubble-atlas.webp"
          test "$(node -p "require('$ROOT/maps/index.json').defaultMapId")" = "northern-song-lanzhou-1104"
          test "$(node -p "require('$ROOT/maps/northern-song-lanzhou-1104/map.json').runtimeSource")" = "external-maps-directory"
          if grep -R -F '崇宁三年（1104）· 游戏比例地图' "$ROOT/app" >/dev/null 2>&1; then
            echo 'Map-specific Lanzhou markup is still bundled into app/.' >&2
            exit 1
          fi
          test -f "$ROOT/docs/FUTURE-ROADMAP.md"
          test ! -f "$ROOT/README.md"
          test ! -d "$ROOT/map"
          test ! -d "$ROOT/data"
          test ! -d "$ROOT/public"
          test "$(find "$ROOT" -maxdepth 1 -type f -iname '*.bat' | wc -l)" -eq 1
          test "$(find "$ROOT" -maxdepth 1 -type f -iname '*.exe' | wc -l)" -eq 0

          cd "$GITHUB_WORKSPACE/release"
          ARCHIVE="RPGmap-v${PACKAGE_VERSION}.zip"
          python - <<'PY'
          from pathlib import Path
          import os, zipfile
          release = Path(os.environ['GITHUB_WORKSPACE']) / 'release'
          version = os.environ['PACKAGE_VERSION']
          root = release / f'RPGmap-v{version}'
          archive = release / f'RPGmap-v{version}.zip'
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for item in sorted(root.rglob('*')):
                  arcname = item.relative_to(release).as_posix()
                  if item.is_dir():
                      zf.writestr(arcname.rstrip('/') + '/', b'')
                  else:
                      zf.write(item, arcname)
          PY
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

          VERIFY="$GITHUB_WORKSPACE/release/verify"
          rm -rf "$VERIFY"
          mkdir -p "$VERIFY"
          python - <<'PY'
          from pathlib import Path
          import os, zipfile
          release = Path(os.environ['GITHUB_WORKSPACE']) / 'release'
          version = os.environ['PACKAGE_VERSION']
          with zipfile.ZipFile(release / f'RPGmap-v{version}.zip') as zf:
              zf.extractall(release / 'verify')
          PY
          VROOT="$VERIFY/RPGmap-v${PACKAGE_VERSION}"
          test -f "$VROOT/RPGmap.bat"
          test -f "$VROOT/launcher/rpgmap-runtime.ps1"
          test -f "$VROOT/操作说明.md"
          test -f "$VROOT/launcher/launcher.mjs"
          test -f "$VROOT/server/server.mjs"
          test -f "$VROOT/maps/index.json"
          test -f "$VROOT/maps/northern-song-lanzhou-1104/map.json"
          test -f "$VROOT/maps/northern-song-lanzhou-1104/assets/yellow-river.webp"
          test "$(find "$VROOT" -maxdepth 1 -type f -iname '*.bat' | wc -l)" -eq 1
          test "$(find "$VROOT" -maxdepth 1 -type f -iname '*.exe' | wc -l)" -eq 0
          test "$(node -p "require('$VROOT/VERSION.json').launcherMode")" = "single-bat-powershell-web-admin-console"
          test "$(node -p "require('$VROOT/VERSION.json').mapPackageMode")" = "external-runtime-maps"
          rm -rf "$VERIFY"

          if unzip -l "$ARCHIVE" | grep -E '(^|/)(\.git|node_modules|tests?|coverage|\.cache|npm-cache|__pycache__|playwright-report|test-results)(/|$)'; then
            echo 'Forbidden development files detected in release ZIP.' >&2
            exit 1
          fi

      - name: Write release notes
        shell: bash
        run: |
          cat > release/release-notes.md <<EOF
          ## RPGmap ${PACKAGE_VERSION}

          RPGmap ${PACKAGE_VERSION} provides one Windows startup file, one PowerShell Runtime information window, and one browser-based GM Control Center.

          ### Startup
          - \`RPGmap.bat\` is the only package-root launch entry.
          - It opens the simple \`launcher/rpgmap-runtime.ps1\` host.
          - The PowerShell window keeps Node running and shows Launcher/Server/Tunnel output including Local/LAN/Public URLs, Join Code and GM Secret once the Server starts.
          - All interactive GM controls remain in the browser Launcher.
          - No Native Launcher EXE is shipped.

          ### External MapPackages
          - Real map content now lives under \`maps/\`, not inside the built web client.
          - The default map is \`maps/northern-song-lanzhou-1104/map.json\` with its assets under the same map folder.
          - \`maps/index.json\` is the runtime map registry and already reserves the boundary needed by future Scene Manager work.
          - Windows Runtime mounts the root \`maps/\` directory into the static app path through a directory junction, without duplicating map data.

          ### Dynamic local control port
          - Preferred Launcher port is \`29999\`.
          - If occupied, Launcher tries nearby fallback ports and finally lets Windows allocate a free loopback port.
          - The browser automatically opens the actual selected address.

          ### Launcher / GM Admin
          - Local/LAN/Internet lifecycle, connection information and logs in one browser page.
          - pending Player approve, User creation, Default Actor, NONE/OBSERVER/OWNER, Player Key rotation and User deletion.
          - World Manager, Scene Manager and Backup Center remain visible as future reserved modules.

          **Source commit:** \`${GITHUB_SHA}\`
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ARCHIVE="release/RPGmap-v${PACKAGE_VERSION}.zip"
          gh release create "$RELEASE_TAG" \
            "$ARCHIVE" \
            "$ARCHIVE.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RPGmap ${PACKAGE_VERSION}" \
            --notes-file release/release-notes.md
