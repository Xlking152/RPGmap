name: Publish RPGmap Windows Release

on:
  push:
    tags: ['v*']
    branches: ['release-v*']

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
      - run: npm audit --registry=https://registry.npmjs.org --omit=dev --audit-level=high
      - run: npm test
      - run: npm run benchmark
      - run: npm run benchmark:lan -- --assert
      - name: Check tracked JavaScript syntax
        shell: bash
        run: git ls-files -z -- '*.js' '*.mjs' | xargs -0 -n1 node --check
      - run: npm run build
      - run: npm run check:bundle
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "v${VERSION}"
          else
            test "${GITHUB_REF_NAME}" = "release-v${VERSION}"
          fi
          node -e "const v='${VERSION}'.split('.').map(Number); if (v.length !== 3 || v.some(n => !Number.isInteger(n)) || v[0] < 1 || (v[0] === 1 && (v[1] < 5 || (v[1] === 5 && v[2] < 6)))) process.exit(1)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare release notes from changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          NOTES="artifact/RELEASE-NOTES-v${VERSION}.md"
          mkdir -p artifact
          awk -v heading="## v${VERSION}" '
            $0 == heading { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "${NOTES}"
          test -s "${NOTES}"
          printf '\nSource Commit: `%s`\n' "${{ steps.meta.outputs.commit }}" >> "${NOTES}"
      - run: npm run package:local-server
        env:
          RPGMAP_SOURCE_COMMIT: ${{ steps.meta.outputs.commit }}
      - name: Verify release package
        run: node scripts/verify-package.mjs --root=artifact/RPGmap-v${{ steps.meta.outputs.version }} --archive=artifact/RPGmap-v${{ steps.meta.outputs.version }}.zip --commit=${{ steps.meta.outputs.commit }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-v${{ steps.meta.outputs.version }}
          path: |
            artifact/RPGmap-v${{ steps.meta.outputs.version }}.zip
            artifact/RPGmap-v${{ steps.meta.outputs.version }}.zip.sha256
            artifact/RELEASE-NOTES-v${{ steps.meta.outputs.version }}.md
          if-no-files-found: error

  windows-smoke:
    needs: candidate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-v${{ needs.candidate.outputs.version }}
          path: release
      - name: Verify and launch the candidate ZIP
        shell: pwsh
        run: |
          $version = '${{ needs.candidate.outputs.version }}'
          $zip = Join-Path $PWD "release/RPGmap-v$version.zip"
          Expand-Archive -LiteralPath $zip -DestinationPath release/unpacked -Force
          $root = Join-Path $PWD "release/unpacked/RPGmap-v$version"
          & node scripts/verify-package.mjs "--root=$root" "--archive=$zip" "--commit=${{ needs.candidate.outputs.commit }}"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate package verification failed.' }
          & ./scripts/windows-smoke.ps1 -Root $root -Browser edge -TimeoutSeconds 30
          & ./scripts/windows-smoke.ps1 -Root $root -Browser chrome -TimeoutSeconds 30

  publish:
    needs: [candidate, windows-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-v${{ needs.candidate.outputs.version }}
          path: release
      - name: Verify candidate checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c "RPGmap-v${{ needs.candidate.outputs.version }}.zip.sha256"
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.candidate.outputs.version }}" \
            "release/RPGmap-v${{ needs.candidate.outputs.version }}.zip" \
            "release/RPGmap-v${{ needs.candidate.outputs.version }}.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ needs.candidate.outputs.commit }}" --title "RPGmap ${{ needs.candidate.outputs.version }}" \
            --notes-file "release/RELEASE-NOTES-v${{ needs.candidate.outputs.version }}.md"
