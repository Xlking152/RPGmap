name: Publish RPGmap Version Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-local-server-release.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install clean dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src deployment/local-server deployment/launcher -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Build web client
        run: npm run build

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          RELEASE_TAG="v${PACKAGE_VERSION}"
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Refuse duplicate version release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Increase the application version before publishing another release." >&2
            exit 1
          fi

      - name: Assemble clean package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/release/RPGmap-v${PACKAGE_VERSION}"
          rm -rf "$GITHUB_WORKSPACE/release"
          mkdir -p "$ROOT/app" "$ROOT/launcher" "$ROOT/server" "$ROOT/world/uploads" "$ROOT/world/backups" "$ROOT/maps" "$ROOT/docs"

          cp -R dist/. "$ROOT/app/"

          cp deployment/launcher/launcher.mjs "$ROOT/launcher/launcher.mjs"
          cp deployment/launcher/admin-client.mjs "$ROOT/launcher/admin-client.mjs"
          cp deployment/launcher/index.html "$ROOT/launcher/index.html"
          cp deployment/launcher/launcher.js "$ROOT/launcher/launcher.js"
          cp deployment/launcher/launcher.css "$ROOT/launcher/launcher.css"
          cp deployment/launcher/start-rpgmap.bat "$ROOT/启动 RPGmap.bat"

          cp deployment/local-server/server.mjs "$ROOT/server/server.mjs"
          cp deployment/local-server/access-control.mjs "$ROOT/server/access-control.mjs"
          cp deployment/local-server/portable-storage.mjs "$ROOT/server/portable-storage.mjs"

          cp 'deployment/local-server/操作说明.md' "$ROOT/操作说明.md"
          cp deployment/local-server/INTERNET-TEST.md "$ROOT/docs/INTERNET-MULTIPLAYER.md"
          cp deployment/local-server/world/README.txt "$ROOT/world/README.txt"
          cp deployment/local-server/maps/README.txt "$ROOT/maps/README.txt"
          cp '文档/联机使用说明.md' "$ROOT/docs/MULTIPLAYER-GUIDE.md"
          cp '文档/未来规划.md' "$ROOT/docs/FUTURE-ROADMAP.md"
          cp CHANGELOG.md "$ROOT/docs/CHANGELOG.md"

          cat > "$ROOT/VERSION.json" <<EOF
          {
            "app": "RPGmap",
            "version": "${PACKAGE_VERSION}",
            "releaseTag": "${RELEASE_TAG}",
            "commit": "${GITHUB_SHA}",
            "serverMode": "multiplayer",
            "storageMode": "portable-world-maps",
            "launcherMode": "unified-admin-console",
            "defaultPort": 30000,
            "launcherPort": 29999
          }
          EOF

          test -f "$ROOT/app/index.html"
          test -f "$ROOT/launcher/launcher.mjs"
          test -f "$ROOT/launcher/admin-client.mjs"
          test -f "$ROOT/launcher/index.html"
          test -f "$ROOT/launcher/launcher.js"
          test -f "$ROOT/launcher/launcher.css"
          test -f "$ROOT/server/server.mjs"
          test -f "$ROOT/server/access-control.mjs"
          test -f "$ROOT/server/portable-storage.mjs"
          test -f "$ROOT/启动 RPGmap.bat"
          test -f "$ROOT/操作说明.md"
          test -f "$ROOT/world/README.txt"
          test -d "$ROOT/world/uploads"
          test -d "$ROOT/world/backups"
          test -f "$ROOT/maps/README.txt"
          test -f "$ROOT/docs/MULTIPLAYER-GUIDE.md"
          test ! -f "$ROOT/README.md"
          test ! -f "$ROOT/server.mjs"
          test ! -f "$ROOT/start-rpgmap.bat"
          test ! -f "$ROOT/start-rpgmap-internet.bat"
          test ! -f "$ROOT/setup-cloudflared.bat"
          test ! -f "$ROOT/run-rpgmap-public-server.bat"
          test ! -d "$ROOT/map"
          test ! -d "$ROOT/data"
          test ! -d "$ROOT/public"
          test "$(find "$ROOT" -maxdepth 1 -type f -iname '*.bat' | wc -l)" -eq 1

          cd "$GITHUB_WORKSPACE/release"
          ARCHIVE="RPGmap-v${PACKAGE_VERSION}.zip"
          python - <<'PY'
          from pathlib import Path
          import os, zipfile
          release = Path(os.environ['GITHUB_WORKSPACE']) / 'release'
          version = os.environ['PACKAGE_VERSION']
          root = release / f'RPGmap-v{version}'
          archive = release / f'RPGmap-v{version}.zip'
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for item in sorted(root.rglob('*')):
                  arcname = item.relative_to(release).as_posix()
                  if item.is_dir():
                      zf.writestr(arcname.rstrip('/') + '/', b'')
                  else:
                      zf.write(item, arcname)
          PY
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

          VERIFY="$GITHUB_WORKSPACE/release/verify"
          rm -rf "$VERIFY"
          mkdir -p "$VERIFY"
          python - <<'PY'
          from pathlib import Path
          import os, zipfile
          release = Path(os.environ['GITHUB_WORKSPACE']) / 'release'
          version = os.environ['PACKAGE_VERSION']
          archive = release / f'RPGmap-v{version}.zip'
          verify = release / 'verify'
          with zipfile.ZipFile(archive) as zf:
              zf.extractall(verify)
          PY
          VROOT="$VERIFY/RPGmap-v${PACKAGE_VERSION}"
          test -f "$VROOT/启动 RPGmap.bat"
          test -f "$VROOT/操作说明.md"
          test -f "$VROOT/launcher/launcher.mjs"
          test -f "$VROOT/server/server.mjs"
          test -f "$VROOT/app/index.html"
          test -f "$VROOT/world/README.txt"
          test -f "$VROOT/maps/README.txt"
          test ! -f "$VROOT/README.md"
          test ! -f "$VROOT/start-rpgmap.bat"
          test ! -f "$VROOT/start-rpgmap-internet.bat"
          test ! -f "$VROOT/setup-cloudflared.bat"
          test ! -f "$VROOT/run-rpgmap-public-server.bat"
          test "$(find "$VROOT" -maxdepth 1 -type f -iname '*.bat' | wc -l)" -eq 1
          test "$(node -p "require('$VROOT/VERSION.json').launcherMode")" = "unified-admin-console"
          rm -rf "$VERIFY"

          if unzip -l "$ARCHIVE" | grep -E '(^|/)(\.git|node_modules|tests?|coverage|\.cache|npm-cache|__pycache__|playwright-report|test-results)(/|$)'; then
            echo 'Forbidden development files detected in release ZIP.' >&2
            exit 1
          fi

      - name: Write release notes
        shell: bash
        run: |
          cat > release/release-notes.md <<EOF
          ## RPGmap ${PACKAGE_VERSION}

          RPGmap ${PACKAGE_VERSION} adds a unified Launcher / GM Control Center on top of the portable \`app / world / maps\` layout and Multiplayer permission system.

          ### Unified Launcher
          - Windows users launch RPGmap through one root entry: \`启动 RPGmap.bat\`.
          - Local/LAN and Internet Multiplayer are started from one browser control center.
          - The Launcher displays Local/LAN/Public URLs, Join Code, GM Secret, Player Invite, storage paths and runtime logs.
          - Internet mode detects cloudflared and can download the official Windows binary when missing.

          ### GM Admin Console
          - Approve pending Players.
          - Pre-create Player Users.
          - Set Default Actor and NONE / OBSERVER / OWNER.
          - Rotate Player Keys and delete Users.
          - Launcher uses a hidden local GM WebSocket Session instead of editing \`world/users.json\` directly.

          ### Security
          - Launcher listens only on \`127.0.0.1:29999\`.
          - Cloudflare tunnels only the game server port.
          - Player Invite never contains GM Secret.

          ### Package Layout
          - \`launcher/\` contains Launcher internals.
          - \`server/\` contains Multiplayer Server internals.
          - Root package contains only one Windows BAT launcher.
          - \`world/\` remains the persistent Campaign data root and \`maps/\` remains the Map / Scene library.

          **Source commit:** \`${GITHUB_SHA}\`
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ARCHIVE="release/RPGmap-v${PACKAGE_VERSION}.zip"
          gh release create "$RELEASE_TAG" \
            "$ARCHIVE" \
            "$ARCHIVE.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RPGmap ${PACKAGE_VERSION}" \
            --notes-file release/release-notes.md
