name: Publish RPGmap Version Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-local-server-release.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install clean dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src deployment/local-server -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Build web client
        run: npm run build

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          RELEASE_TAG="v${PACKAGE_VERSION}"
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Refuse duplicate version release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Increase the application version before publishing another release." >&2
            exit 1
          fi

      - name: Assemble clean server package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/release/RPGmap-v${PACKAGE_VERSION}"
          rm -rf "$GITHUB_WORKSPACE/release"
          mkdir -p "$ROOT/app" "$ROOT/world/uploads" "$ROOT/world/backups" "$ROOT/maps" "$ROOT/docs"

          cp -R dist/. "$ROOT/app/"
          cp deployment/local-server/server.mjs "$ROOT/server.mjs"
          cp deployment/local-server/access-control.mjs "$ROOT/access-control.mjs"
          cp deployment/local-server/portable-storage.mjs "$ROOT/portable-storage.mjs"
          cp deployment/local-server/internet-launcher.mjs "$ROOT/internet-launcher.mjs"
          cp deployment/local-server/start-rpgmap.bat "$ROOT/start-rpgmap.bat"
          cp deployment/local-server/start-rpgmap.sh "$ROOT/start-rpgmap.sh"
          cp deployment/local-server/start-rpgmap-internet.bat "$ROOT/start-rpgmap-internet.bat"
          cp deployment/local-server/setup-cloudflared.bat "$ROOT/setup-cloudflared.bat"
          cp deployment/local-server/run-rpgmap-public-server.bat "$ROOT/run-rpgmap-public-server.bat"
          cp 'deployment/local-server/操作说明.md' "$ROOT/操作说明.md"
          cp deployment/local-server/INTERNET-TEST.md "$ROOT/docs/INTERNET-MULTIPLAYER.md"
          cp deployment/local-server/world/README.txt "$ROOT/world/README.txt"
          cp deployment/local-server/maps/README.txt "$ROOT/maps/README.txt"
          cp '文档/联机使用说明.md' "$ROOT/docs/MULTIPLAYER-GUIDE.md"
          cp '文档/未来规划.md' "$ROOT/docs/FUTURE-ROADMAP.md"
          cp CHANGELOG.md "$ROOT/docs/CHANGELOG.md"
          chmod +x "$ROOT/start-rpgmap.sh"

          cat > "$ROOT/VERSION.json" <<EOF
          {
            "app": "RPGmap",
            "version": "${PACKAGE_VERSION}",
            "releaseTag": "${RELEASE_TAG}",
            "commit": "${GITHUB_SHA}",
            "serverMode": "multiplayer",
            "storageMode": "portable-world-maps",
            "defaultPort": 30000
          }
          EOF

          test -f "$ROOT/app/index.html"
          test -f "$ROOT/server.mjs"
          test -f "$ROOT/access-control.mjs"
          test -f "$ROOT/portable-storage.mjs"
          test -f "$ROOT/internet-launcher.mjs"
          test -f "$ROOT/start-rpgmap-internet.bat"
          test -f "$ROOT/setup-cloudflared.bat"
          test -f "$ROOT/操作说明.md"
          test -f "$ROOT/world/README.txt"
          test -d "$ROOT/world/uploads"
          test -d "$ROOT/world/backups"
          test -f "$ROOT/maps/README.txt"
          test -f "$ROOT/docs/MULTIPLAYER-GUIDE.md"
          test ! -d "$ROOT/map"
          test ! -d "$ROOT/data"
          test ! -d "$ROOT/public"
          test ! -f "$ROOT/README.md"

          cd "$GITHUB_WORKSPACE/release"
          ARCHIVE="RPGmap-v${PACKAGE_VERSION}.zip"
          zip -r -9 -q "$ARCHIVE" "RPGmap-v${PACKAGE_VERSION}"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

          if unzip -l "$ARCHIVE" | grep -E '(^|/)(\.git|node_modules|tests?|coverage|\.cache|npm-cache|__pycache__|playwright-report|test-results)(/|$)'; then
            echo 'Forbidden development files detected in release ZIP.' >&2
            exit 1
          fi

      - name: Write release notes
        shell: bash
        run: |
          cat > release/release-notes.md <<EOF
          ## RPGmap ${PACKAGE_VERSION}

          RPGmap ${PACKAGE_VERSION} 在 Player Identity / Actor Ownership / Combat Turn Lock 的基础上，进一步统一发布包的数据边界：\`app/\` 是程序，\`world/\` 是当前游戏状态，\`maps/\` 是真正的地图 / Scene 资源库。

          ### Portable Layout
          - \`app/\`：前端程序，可随版本升级替换。
          - \`world/state.json\`：共享 World Snapshot / revision。
          - \`world/users.json\`：Player User、默认 Actor、Ownership 与凭证哈希。
          - \`world/uploads/\` / \`world/backups/\`：当前 World 的上传与备份。
          - \`maps/\`：为多地图、可破坏建筑、碰撞 / 导航、环境特效和地图变体预留的 Map Library。
          - 默认不依赖 AppData 或其他隐藏 User Data 目录。

          ### Migration
          - V1.4.1 \`map/world.json\` 自动迁移到 \`world/state.json\`。
          - V1.4.1 \`map/users.json\` 自动迁移到 \`world/users.json\`。
          - 更老的 \`data/worlds/default/world.json\` / \`access.json\` 仍然支持迁移。
          - 旧文件保留不删除，新目录存在时永远以新目录为准。

          ### Documentation
          - GitHub 根 \`README.md\` 只作为项目整体说明。
          - 发布包根目录改用 \`操作说明.md\`，专门说明启动、联机、User、Ownership、备份和迁移。

          ### Multiplayer Permissions
          - Player 首次加入由 GM 批准为持久 User；也支持 GM 预创建 User + Player Key。
          - Actor 权限：NONE / OBSERVER / OWNER。
          - Combat active 时 Player 只能操控当前 Turn 对应的 OWNER Actor。
          - Client 预检 + Server authoritative validation 双层权限校验。

          **Source commit:** \`${GITHUB_SHA}\`
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ARCHIVE="release/RPGmap-v${PACKAGE_VERSION}.zip"
          gh release create "$RELEASE_TAG" \
            "$ARCHIVE" \
            "$ARCHIVE.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RPGmap ${PACKAGE_VERSION}" \
            --notes-file release/release-notes.md
