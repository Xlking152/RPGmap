name: Publish RPGmap Version Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-local-server-release.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install clean dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build web client
        run: npm run build

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          RELEASE_TAG="v${PACKAGE_VERSION}"
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Refuse duplicate version release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Increase the application version before publishing another release." >&2
            exit 1
          fi

      - name: Assemble clean server package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/release/RPGmap-Server-v${PACKAGE_VERSION}"
          rm -rf "$GITHUB_WORKSPACE/release"
          mkdir -p "$ROOT/public" "$ROOT/data/worlds" "$ROOT/data/uploads" "$ROOT/data/backups" "$ROOT/docs"

          cp -R dist/. "$ROOT/public/"
          cp deployment/local-server/server.mjs "$ROOT/server.mjs"
          cp deployment/local-server/start-rpgmap.bat "$ROOT/start-rpgmap.bat"
          cp deployment/local-server/start-rpgmap.sh "$ROOT/start-rpgmap.sh"
          cp deployment/local-server/README.md "$ROOT/README.md"
          cp deployment/local-server/data/README.txt "$ROOT/data/README.txt"
          cp '文档/未来规划.md' "$ROOT/docs/FUTURE-ROADMAP.md"
          chmod +x "$ROOT/start-rpgmap.sh"

          cat > "$ROOT/VERSION.json" <<EOF
          {
            "app": "RPGmap",
            "version": "${PACKAGE_VERSION}",
            "releaseTag": "${RELEASE_TAG}",
            "commit": "${GITHUB_SHA}",
            "serverMode": "local-static",
            "defaultPort": 30000
          }
          EOF

          test -f "$ROOT/public/index.html"
          test -f "$ROOT/README.md"

          python - <<'PY'
          from pathlib import Path
          import sys
          roots = list(Path('release').glob('RPGmap-Server-v*'))
          root = roots[0]
          bad = [str(p.relative_to(root)) for p in root.rglob('*') if not str(p.relative_to(root)).isascii()]
          if bad:
              print('Non-ASCII release paths are forbidden:', file=sys.stderr)
              for path in bad:
                  print('  ' + path, file=sys.stderr)
              raise SystemExit(1)
          PY

          cd "$GITHUB_WORKSPACE/release"
          ARCHIVE="RPGmap-Server-v${PACKAGE_VERSION}.zip"
          zip -r -9 -q "$ARCHIVE" "RPGmap-Server-v${PACKAGE_VERSION}"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

          if unzip -l "$ARCHIVE" | grep -E '(^|/)(\.git|node_modules|tests?|coverage|\.cache|npm-cache|__pycache__|playwright-report|test-results)(/|$)'; then
            echo 'Forbidden development files detected in release ZIP.' >&2
            exit 1
          fi

      - name: Write release notes
        shell: bash
        run: |
          cat > release/release-notes.md <<EOF
          ## RPGmap ${PACKAGE_VERSION}

          RPGmap ${PACKAGE_VERSION} 将角色系统、Token 框选、移动与测距、先攻战斗、Health / Damage / Healing 以及 Chat / Game Log 整合为完整的跑团工作流。

          ### 主要更新
          - Actor Sheet：技能 / 豁免、不良状态、多 Form 与 XLSX 最终值导入。
          - Selection：Token 单选、多选、矩形框选，支持 Shift 追加、Alt 移除。
          - Ruler：自由测距、Waypoint，以及从当前角色位置开始测距。
          - Combat：手填先攻、拖动排序、轮次 / 当前回合与显式加入参战者。
          - Health：保留 SimpleHP，并加入完好 / B / L / A WoundTrack。
          - Damage / Healing：对所选 Token 应用最终伤害或实际恢复量，并写入 Game Log。
          - Token 生命条：SimpleHP 比例条与 WoundTrack 分段生命槽可视化。
          - Chat / Game Log：聊天、战斗、伤害、恢复记录，并预留后续投骰接口。

          ### 使用
          - Windows：解压后双击 \`start-rpgmap.bat\`
          - Linux / macOS：执行 \`./start-rpgmap.sh\`
          - 默认地址：\`http://127.0.0.1:30000\`
          - ZIP 根目录的 \`README.md\` 包含完整操作指南。

          **Source commit:** \`${GITHUB_SHA}\`
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ARCHIVE="release/RPGmap-Server-v${PACKAGE_VERSION}.zip"
          gh release create "$RELEASE_TAG" \
            "$ARCHIVE" \
            "$ARCHIVE.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RPGmap ${PACKAGE_VERSION}" \
            --notes-file release/release-notes.md
