name: Publish RPGmap Version Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-local-server-release.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install clean dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src deployment/local-server -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Build web client
        run: npm run build

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          RELEASE_TAG="v${PACKAGE_VERSION}"
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Refuse duplicate version release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Increase the application version before publishing another release." >&2
            exit 1
          fi

      - name: Assemble clean server package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/release/RPGmap-v${PACKAGE_VERSION}"
          rm -rf "$GITHUB_WORKSPACE/release"
          mkdir -p "$ROOT/public" "$ROOT/data/worlds" "$ROOT/data/uploads" "$ROOT/data/backups" "$ROOT/docs"

          cp -R dist/. "$ROOT/public/"
          cp deployment/local-server/server.mjs "$ROOT/server.mjs"
          cp deployment/local-server/internet-launcher.mjs "$ROOT/internet-launcher.mjs"
          cp deployment/local-server/start-rpgmap.bat "$ROOT/start-rpgmap.bat"
          cp deployment/local-server/start-rpgmap.sh "$ROOT/start-rpgmap.sh"
          cp deployment/local-server/start-rpgmap-internet.bat "$ROOT/start-rpgmap-internet.bat"
          cp deployment/local-server/setup-cloudflared.bat "$ROOT/setup-cloudflared.bat"
          cp deployment/local-server/run-rpgmap-public-server.bat "$ROOT/run-rpgmap-public-server.bat"
          cp deployment/local-server/README.md "$ROOT/README.md"
          cp deployment/local-server/INTERNET-TEST.md "$ROOT/INTERNET-MULTIPLAYER.md"
          cp deployment/local-server/data/README.txt "$ROOT/data/README.txt"
          cp '文档/联机使用说明.md' "$ROOT/docs/MULTIPLAYER-GUIDE.md"
          cp '文档/未来规划.md' "$ROOT/docs/FUTURE-ROADMAP.md"
          cp CHANGELOG.md "$ROOT/docs/CHANGELOG.md"
          chmod +x "$ROOT/start-rpgmap.sh"

          cat > "$ROOT/VERSION.json" <<EOF
          {
            "app": "RPGmap",
            "version": "${PACKAGE_VERSION}",
            "releaseTag": "${RELEASE_TAG}",
            "commit": "${GITHUB_SHA}",
            "serverMode": "multiplayer",
            "defaultPort": 30000
          }
          EOF

          test -f "$ROOT/public/index.html"
          test -f "$ROOT/server.mjs"
          test -f "$ROOT/internet-launcher.mjs"
          test -f "$ROOT/start-rpgmap-internet.bat"
          test -f "$ROOT/setup-cloudflared.bat"
          test -f "$ROOT/docs/MULTIPLAYER-GUIDE.md"

          python - <<'PY'
          from pathlib import Path
          import sys
          roots = list(Path('release').glob('RPGmap-v*'))
          root = roots[0]
          bad = [str(p.relative_to(root)) for p in root.rglob('*') if not str(p.relative_to(root)).isascii()]
          if bad:
              print('Non-ASCII release paths are forbidden:', file=sys.stderr)
              for path in bad:
                  print('  ' + path, file=sys.stderr)
              raise SystemExit(1)
          PY

          cd "$GITHUB_WORKSPACE/release"
          ARCHIVE="RPGmap-v${PACKAGE_VERSION}.zip"
          zip -r -9 -q "$ARCHIVE" "RPGmap-v${PACKAGE_VERSION}"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

          if unzip -l "$ARCHIVE" | grep -E '(^|/)(\.git|node_modules|tests?|coverage|\.cache|npm-cache|__pycache__|playwright-report|test-results)(/|$)'; then
            echo 'Forbidden development files detected in release ZIP.' >&2
            exit 1
          fi

      - name: Write release notes
        shell: bash
        run: |
          cat > release/release-notes.md <<EOF
          ## RPGmap ${PACKAGE_VERSION}

          RPGmap ${PACKAGE_VERSION} 正式加入 Multiplayer V1：GM / Player、WebSocket 共享 World、World Store 持久化，以及 Windows 一键 Cloudflare Quick Tunnel 远程联机。

          ### Multiplayer
          - GM / Player 身份与在线人数。
          - Player Join Code + GM Secret。
          - Actor / Token / Health / Damage / Healing / Combat / Chat / Scene World Snapshot 同步。
          - revision / baseRevision 冲突检查与 Server World 持久化。
          - HTTP 自动使用 WS，HTTPS 自动使用 WSS。

          ### Internet Multiplayer
          - Windows 双击 \`start-rpgmap-internet.bat\` 一键远程联机。
          - 自动检测 / 安装 cloudflared。
          - Cloudflare Quick Tunnel 默认使用 HTTP/2 over TCP。
          - 自动读取 trycloudflare.com Public URL。
          - 自动生成 Join Code / GM Secret。
          - 独立 \`RPGmap Multiplayer Info\` 信息窗口便于查看和复制邀请信息。

          ### 使用
          - 本机 / LAN：Windows 双击 \`start-rpgmap.bat\`，Linux/macOS 执行 \`./start-rpgmap.sh\`。
          - Windows 远程：双击 \`start-rpgmap-internet.bat\`。
          - 玩家只需要 Public URL + Join Code；GM Secret 不应分享。
          - ZIP 内 \`README.md\` 和 \`docs/MULTIPLAYER-GUIDE.md\` 包含完整说明。

          **Source commit:** \`${GITHUB_SHA}\`
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ARCHIVE="release/RPGmap-v${PACKAGE_VERSION}.zip"
          gh release create "$RELEASE_TAG" \
            "$ARCHIVE" \
            "$ARCHIVE.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RPGmap ${PACKAGE_VERSION}" \
            --notes-file release/release-notes.md
