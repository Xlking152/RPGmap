name: Publish RPGmap Version Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install clean dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build web client
        run: npm run build

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          RELEASE_TAG="v${PACKAGE_VERSION}"
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Remove legacy S0 releases when present
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in s0-local-server-1 s0-local-server-2 s0-local-server-3 s0-local-server-4 s0-local-server-5; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            else
              git push origin ":refs/tags/$tag" >/dev/null 2>&1 || true
            fi
          done

      - name: Refuse duplicate version release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Increase the application version only after confirmation." >&2
            exit 1
          fi

      - name: Assemble clean server package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/release/RPGmap-Server-v${PACKAGE_VERSION}"
          rm -rf "$GITHUB_WORKSPACE/release"
          mkdir -p "$ROOT/public" "$ROOT/data/worlds" "$ROOT/data/uploads" "$ROOT/data/backups" "$ROOT/docs"

          cp -R dist/. "$ROOT/public/"
          cp deployment/local-server/server.mjs "$ROOT/server.mjs"
          cp deployment/local-server/start-rpgmap.bat "$ROOT/start-rpgmap.bat"
          cp deployment/local-server/start-rpgmap.sh "$ROOT/start-rpgmap.sh"
          cp deployment/local-server/README.md "$ROOT/README.md"
          cp deployment/local-server/data/README.txt "$ROOT/data/README.txt"
          cp '文档/未来规划.md' "$ROOT/docs/FUTURE-ROADMAP.md"
          chmod +x "$ROOT/start-rpgmap.sh"

          cat > "$ROOT/VERSION.json" <<EOF
          {
            "app": "RPGmap",
            "version": "${PACKAGE_VERSION}",
            "releaseTag": "${RELEASE_TAG}",
            "commit": "${GITHUB_SHA}",
            "serverMode": "local-static",
            "defaultPort": 30000
          }
          EOF

          test -f "$ROOT/public/index.html"

          python - <<'PY'
          from pathlib import Path
          import sys
          roots = list(Path('release').glob('RPGmap-Server-v*'))
          root = roots[0]
          bad = [str(p.relative_to(root)) for p in root.rglob('*') if not str(p.relative_to(root)).isascii()]
          if bad:
              print('Non-ASCII release paths are forbidden:', file=sys.stderr)
              for path in bad:
                  print('  ' + path, file=sys.stderr)
              raise SystemExit(1)
          PY

          cd "$GITHUB_WORKSPACE/release"
          ARCHIVE="RPGmap-Server-v${PACKAGE_VERSION}.zip"
          zip -r -9 -q "$ARCHIVE" "RPGmap-Server-v${PACKAGE_VERSION}"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

          if unzip -l "$ARCHIVE" | grep -E '(^|/)(\.git|node_modules|tests?|coverage|\.cache|npm-cache|__pycache__|playwright-report|test-results)(/|$)'; then
            echo 'Forbidden development files detected in release ZIP.' >&2
            exit 1
          fi

      - name: Write release notes
        shell: bash
        run: |
          cat > release/release-notes.md <<EOF
          ## RPGmap ${PACKAGE_VERSION}

          RPGmap 是面向 TRPG / VTT 的自托管地图工具。该 Release 使用应用版本号，而不是 CI 构建编号。

          ### 使用
          - Windows：解压后双击 \`start-rpgmap.bat\`
          - Linux / macOS：执行 \`./start-rpgmap.sh\`
          - 默认地址：\`http://127.0.0.1:30000\`

          ### 当前阶段
          本版本已包含 MovementSystem、EntitySystem、AppShell UI 和本地 HTTP Server。World Store、WebSocket、权限与多人同步仍按未来规划继续开发。

          **Source commit:** \`${GITHUB_SHA}\`
          EOF

      - name: Publish GitHub Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ARCHIVE="release/RPGmap-Server-v${PACKAGE_VERSION}.zip"
          gh release create "$RELEASE_TAG" \
            "$ARCHIVE" \
            "$ARCHIVE.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RPGmap ${PACKAGE_VERSION}" \
            --notes-file release/release-notes.md \
            --prerelease
