name: Verify Authority Convergence

on:
  push:
    branches:
      - refactor/health-world-operation-authority
    paths:
      - .github/workflows/verify-authority-convergence.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/health-world-operation-authority
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Check JavaScript syntax
        run: find src deployment scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - run: npm run build
      - run: npm run package:local-server
