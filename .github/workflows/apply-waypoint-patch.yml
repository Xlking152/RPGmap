name: Apply waypoint movement patch

on:
  push:
    branches:
      - feat/fvtt-waypoint-movement
    paths:
      - .github/workflows/apply-waypoint-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fvtt-waypoint-movement
          fetch-depth: 0
      - name: Apply tested patch
        run: |
          git apply --check .automation/fvtt-waypoint.patch
          git apply .automation/fvtt-waypoint.patch
      - name: Verify tests
        run: |
          npm ci
          npm test
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .automation/fvtt-waypoint.patch .github/workflows/apply-waypoint-patch.yml
          git add -- CHANGELOG.md src/engine/app.js src/engine/movement-path.js tests/movement-path.test.js
          git commit -m "feat: add FVTT-style waypoint movement"
          git push origin HEAD:feat/fvtt-waypoint-movement
