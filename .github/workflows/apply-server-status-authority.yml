name: Apply Server Status Authority Patch

on:
  push:
    branches:
      - refactor/status-definition-authority
    paths:
      - .github/workflows/apply-server-status-authority.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/status-definition-authority
      - name: Remove LAN Effect changes projection and update tests
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const serverPath = 'deployment/local-server/status-operations.mjs';
          let server = fs.readFileSync(serverPath, 'utf8');
          const syncBlock = `      entities.statusDefinitions[index] = definition;\n      // Legacy Entity resolution still reads a projected \`changes\` array from\n      // Actor effects. Keep that projection synchronized with the canonical\n      // World definition so an edited definition takes effect immediately on\n      // every LAN client.\n      for (const actor of entities.actors) {\n        for (const effect of actor.effects || []) {\n          if (String(effect.definitionId) !== definition.id) continue;\n          if (definition.changes.length) effect.changes = structuredClone(definition.changes);\n          else delete effect.changes;\n        }\n      }`;
          if (!server.includes(syncBlock)) throw new Error('Server definition projection block not found');
          server = server.replace(syncBlock, '      entities.statusDefinitions[index] = definition;');

          const copyLine = `      if (scope === 'actor' && definition.changes?.length) effect.changes = structuredClone(definition.changes);\n`;
          if (!server.includes(copyLine)) throw new Error('Server status.apply changes copy not found');
          server = server.replace(copyLine, '');
          fs.writeFileSync(serverPath, server);

          const testPath = 'tests/status-server-operations.test.js';
          let test = fs.readFileSync(testPath, 'utf8');
          test = test.replace(
            "test('server definition edits refresh Actor projections and status metadata atomically', () => {",
            "test('server definition edits keep Effect instances runtime-only and update canonical rules atomically', () => {",
          );
          const firstOld = `  assert.deepEqual(state.preferences.entitySystem.actors[0].effects[0].changes, [\n    { target: 'resources.hp.max', mode: 'add', value: 1 },\n  ]);`;
          const firstNew = `  const effectBeforeDefinitionEdit = structuredClone(state.preferences.entitySystem.actors[0].effects[0]);\n  assert.equal(Object.hasOwn(effectBeforeDefinitionEdit, 'changes'), false);\n  assert.deepEqual(state.preferences.entitySystem.statusDefinitions\n    .find(item => item.id === 'status-ward').changes, [\n    { target: 'resources.hp.max', mode: 'add', value: 1 },\n  ]);`;
          if (!test.includes(firstOld)) throw new Error('First server projection assertion not found');
          test = test.replace(firstOld, firstNew);

          const secondOld = `  assert.deepEqual(state.preferences.entitySystem.actors[0].effects[0].changes, [\n    { target: 'resources.hp.max', mode: 'add', value: 3 },\n  ]);`;
          const secondNew = `  assert.deepEqual(state.preferences.entitySystem.actors[0].effects[0], effectBeforeDefinitionEdit);\n  assert.equal(Object.hasOwn(state.preferences.entitySystem.actors[0].effects[0], 'changes'), false);\n  assert.deepEqual(state.preferences.entitySystem.statusDefinitions\n    .find(item => item.id === 'status-ward').changes, [\n    { target: 'resources.hp.max', mode: 'add', value: 3 },\n  ]);`;
          if (!test.includes(secondOld)) throw new Error('Second server projection assertion not found');
          test = test.replace(secondOld, secondNew);

          const finalAssertion = `  assert.deepEqual({ stacks: effect.stacks, enabled: effect.enabled, note: effect.note }, {\n    stacks: 4, enabled: false, note: '由场景压制',\n  });`;
          const finalReplacement = `${finalAssertion}\n  assert.equal(Object.hasOwn(effect, 'changes'), false);`;
          if (!test.includes(finalAssertion)) throw new Error('Final runtime effect assertion not found');
          test = test.replace(finalAssertion, finalReplacement);
          fs.writeFileSync(testPath, test);
          NODE
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment/local-server/status-operations.mjs tests/status-server-operations.test.js
          git commit -m "Remove LAN Effect changes projection"
          git push origin HEAD:refactor/status-definition-authority
